<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDAC eSign Redirection Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f7f6;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 150px;
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .hint {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Test CDAC eSign Redirect</h2>
        <p>Paste the values from your JSON response below to test the redirection to CDAC.</p>

        <form id="esignForm" method="POST" action="https://es-staging.cdac.in/esignlevel2/2.1/form/signdoc">

            <div class="hint">aspTxnID</div>
            <input type="text" name="aspTxnID" id="aspTxnID" placeholder="e.g., ASP-123" required>

            <div class="hint">eSignRequest (XML Payload)</div>
            <textarea name="eSignRequest" id="eSignRequest" placeholder="Paste the <Esign> XML here..."
                required></textarea>

            <button type="submit">Submit to CDAC</button>
        </form>
    </div>

    <script>
        // Optional: If you want to intercept the form submission to dynamically change the action URL based on input
        document.getElementById('esignForm').addEventListener('submit', function (e) {
            // e.preventDefault(); 
            // Form will naturally POST to the action URL with the eSignRequest and aspTxnID as form data.
        });
    </script>

</body>

</html>
